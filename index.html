<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Predicción LUD</title>
<meta name="description" content="La penca del grupo: pronósticos de la Divisional A Mayores de la Liga Universitaria.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231d6b3c'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' text-anchor='middle' fill='%23ffffff'%3ELUD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concepto: día de partido. Franja de césped con la cuenta regresiva al cierre arriba; abajo, papel tiza con las tarjetas de cada partido. */
:root{
  --pitch:#1d6b3c; --pitch-2:#22773f; --pitch-ink:#0f3d22; --chalk:#f7f9f4;
  --bg:#eef2ec; --surface:#ffffff; --surface-2:#e6ece4; --line:#d3ddd1;
  --fg:#13221a; --muted:#5b6c62;
  --accent:#1d6b3c; --accent-soft:#dcecdf; --accent-fg:#ffffff;
  --sel:#13221a; --sel-fg:#ffffff;
  --yellow:#f2c230; --yellow-ink:#3a2c00; --red:#d0453a;
  --win:#1f8a4c; --win-soft:#d9f0e2; --miss:#c2443a; --miss-soft:#f7e0dd;
  --display:"Big Shoulders Display","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pitch:#123f25; --pitch-2:#154a2b; --pitch-ink:#0a2616; --chalk:#eef4ee;
  --bg:#0b140f; --surface:#122019; --surface-2:#192b21; --line:#24392c;
  --fg:#e7efe9; --muted:#93a89b;
  --accent:#5fcf8c; --accent-soft:#16301f; --accent-fg:#06140b;
  --sel:#e7efe9; --sel-fg:#0b140f;
  --win:#4cc27e; --win-soft:#123224; --miss:#ec7a6c; --miss-soft:#3a1b18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --pitch:#123f25; --pitch-2:#154a2b; --pitch-ink:#0a2616; --chalk:#eef4ee;
  --bg:#0b140f; --surface:#122019; --surface-2:#192b21; --line:#24392c;
  --fg:#e7efe9; --muted:#93a89b;
  --accent:#5fcf8c; --accent-soft:#16301f; --accent-fg:#06140b;
  --sel:#e7efe9; --sel-fg:#0b140f;
  --win:#4cc27e; --win-soft:#123224; --miss:#ec7a6c; --miss-soft:#3a1b18;
  color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pitch)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code{font-size:.85em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- la cancha ---------- */
.pitch{position:relative;overflow:hidden;color:var(--chalk);
  background:repeating-linear-gradient(90deg,var(--pitch) 0 56px,var(--pitch-2) 56px 112px)}
.pitch::after{content:"";position:absolute;pointer-events:none;inset:auto 0 -170px auto;width:340px;height:340px;right:-120px;
  border:2px solid color-mix(in srgb,var(--chalk) 22%,transparent);border-radius:50%}
.pitch::before{content:"";position:absolute;pointer-events:none;top:0;bottom:0;right:50px;border-left:2px solid color-mix(in srgb,var(--chalk) 22%,transparent)}
header.top{padding-block:18px 0}
.brand{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;margin:0;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:.8rem;color:color-mix(in srgb,var(--chalk) 75%,transparent)}
.who{display:flex;align-items:center;gap:8px}
.who-l{font-size:.78rem;color:color-mix(in srgb,var(--chalk) 75%,transparent)}
.who b{font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1}
.authbtn{font:inherit;font-size:.8rem;font-weight:600;background:color-mix(in srgb,var(--chalk) 12%,transparent);color:var(--chalk);border:1px solid color-mix(in srgb,var(--chalk) 40%,transparent);border-radius:999px;padding:5px 12px;cursor:pointer}
.authbtn:hover{background:color-mix(in srgb,var(--chalk) 22%,transparent)}
.kick{position:relative;z-index:1;padding-block:22px 18px;min-height:110px}
.kick .k-label{font-size:.95rem;color:color-mix(in srgb,var(--chalk) 85%,transparent)}
.kick .k-big{font-family:var(--display);font-weight:900;font-size:clamp(3.2rem,13vw,5.4rem);line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.18em;flex-wrap:wrap}
.kick .k-big small{font-size:.42em;font-weight:700;margin-left:.04em;opacity:.8}
.kick .k-sub{margin-top:6px;font-size:.85rem;color:color-mix(in srgb,var(--chalk) 75%,transparent)}
.kick.urgente .k-big{color:var(--yellow)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pitch-ink);box-shadow:0 1px 0 color-mix(in srgb,var(--chalk) 10%,transparent)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.01em;background:none;border:0;color:color-mix(in srgb,var(--chalk) 60%,transparent);padding:11px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--chalk)}
nav.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--chalk)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* ---------- contenido ---------- */
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
.lede{color:var(--muted);font-size:.9rem;margin:0}
.src{font-size:.8rem;color:var(--muted)}
.src a{color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:var(--r);padding:14px 16px;font-size:.93rem}
.notice strong{display:block;margin-bottom:3px;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1}
.notice.warn{border-left-color:var(--miss)}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--miss);border-color:var(--miss);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{font:inherit;font-size:.75rem;background:none;border:0;color:var(--miss);text-decoration:underline;cursor:pointer;padding:0}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.claim{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.claim button{font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.claim button[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.acct{display:block;font-size:.74rem;color:var(--muted);font-weight:400}
.dup{color:var(--miss);font-size:.72rem;font-weight:600}

/* selector de fechas */
.fechas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fechas button{flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:1.15rem;min-width:58px;padding:6px 10px 5px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.fechas button small{font-family:var(--body);font-weight:500;font-size:.7rem;color:var(--muted)}
.fechas button[aria-pressed="true"]{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.fechas button[aria-pressed="true"] small{color:color-mix(in srgb,#fff 80%,transparent)}

/* tarjetas amarillas */
.faltan{display:flex;flex-direction:column;gap:10px}
.faltan h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.3rem;line-height:1}
.cards{display:flex;flex-wrap:wrap;gap:10px 8px;padding-top:2px}
.ycard{position:relative;display:inline-flex;flex-direction:column;justify-content:flex-end;min-width:54px;height:72px;padding:6px 8px;border-radius:5px;background:var(--yellow);color:var(--yellow-ink);
  box-shadow:0 1px 0 rgba(0,0,0,.08),0 4px 10px -6px rgba(0,0,0,.35);transform:rotate(var(--rot,-3deg))}
.ycard b{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1}
.ycard small{font-size:.66rem;font-weight:600;line-height:1.1;opacity:.8}
.todos{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--win)}

/* zonas y partidos */
.zona h2{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.zona h2 small{font-family:var(--body);font-weight:500;font-size:.82rem;color:var(--muted)}
.matches{display:flex;flex-direction:column;gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted);align-items:flex-start}
.meta > span:first-child{min-width:0}
.state{flex:0 0 auto;font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.state.open{background:var(--accent-soft);color:var(--accent)}
.state.final{background:var(--sel);color:var(--sel-fg)}
.picks{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.pick{font:inherit;font-weight:700;min-width:0;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:12px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15;transition:background-color .15s,border-color .15s,transform .15s}
.pick:not(:disabled):hover{border-color:var(--muted)}
.pick .tn{display:block;max-width:100%;overflow-wrap:anywhere}
.pick.e{min-width:62px;font-family:var(--display);font-weight:800;font-size:1.25rem}
.pick .sc{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.pick[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-fg)}
.pick[aria-pressed="true"] .crest path{fill:var(--sel-fg)} .pick[aria-pressed="true"] .crest text{fill:var(--sel)}
.pick.hit[aria-pressed="true"]{background:var(--win);border-color:var(--win);color:#fff}
.pick.miss[aria-pressed="true"]{background:var(--miss);border-color:var(--miss);color:#fff}
.pick.hit[aria-pressed="true"] .crest text{fill:var(--win)} .pick.miss[aria-pressed="true"] .crest text{fill:var(--miss)}
.pick.hit[aria-pressed="true"] .crest path,.pick.miss[aria-pressed="true"] .crest path{fill:#fff}
.pick.result{border-color:var(--win);box-shadow:inset 0 0 0 1.5px var(--win)}
.pick:disabled{cursor:default}
.pick.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.crest{width:30px;height:34px;flex:0 0 auto}
.crest-img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;box-shadow:0 0 0 1px var(--line)}
.res .crest.crest-img{width:30px;height:30px;border-radius:8px;padding:2px}
.crest path{fill:var(--fg)} .crest text{fill:var(--surface-2);font-family:var(--display);font-weight:800}
.vote{display:flex;flex-direction:column;gap:6px}
.vbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.vbar span{display:block;height:100%}
.vbar .vl{background:var(--accent)} .vbar .ve{background:var(--muted)} .vbar .vv{background:var(--yellow)}
.vleg{display:flex;justify-content:space-between;gap:8px;font-size:.74rem;color:var(--muted)}
.vleg b{color:var(--fg);font-variant-numeric:tabular-nums}
.others{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.others b{color:var(--fg);font-weight:600}

/* tabla */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--muted);background:var(--surface-2)}
td.name,th.name{text-align:left;font-weight:600}
td.pos{width:44px}
.posn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-family:var(--display);font-weight:900;font-size:1.15rem}
tr.p1 .posn{background:var(--yellow);color:var(--yellow-ink)}
tr.p2 .posn{background:#c9d1cc;color:#1d2a22}
tr.p3 .posn{background:#d29a6a;color:#2d1a0a}
td.pts{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--accent)}
tr.me td{background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td.f{color:var(--muted)}

/* resultados */
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.res .t{min-width:0;font-weight:700;display:flex;align-items:center;gap:8px}
.res .t.l{justify-content:flex-end;text-align:right}
.res .crest{width:24px;height:28px}
.res .score{font-family:var(--display);font-weight:900;font-size:1.7rem;line-height:1;background:var(--pitch);color:#fff;border-radius:8px;padding:6px 12px 4px;font-variant-numeric:tabular-nums}
.res .score.pend{background:var(--surface-2);color:var(--muted);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.hit{background:var(--win-soft);color:var(--win)}
.chip.miss{background:var(--miss-soft);color:var(--miss)}

/* panel */
.admin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.admin h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1}
.admin .tablewrap{border:0}
.join{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.join input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
form.inline{display:flex;gap:6px;justify-content:center;align-items:center}
form.inline input{width:72px;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:center}
td.acciones{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;white-space:normal}
.cierres{display:flex;flex-direction:column;gap:12px}
.cierre{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.inline-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline-row input{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sel);color:var(--sel-fg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:20;box-shadow:0 6px 20px -8px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}

@media (max-width:560px){
  header.top{padding-block:14px 0}
  .brand h1{font-size:1.35rem}
  .brand p{font-size:.72rem}
  .who-l{display:none}
  .who b{font-size:1.05rem}
  .kick{padding-block:16px 14px;min-height:96px}
  .pitch::after{width:240px;height:240px;right:-110px;bottom:-130px}
  .pitch::before{right:10px}
  nav.tabs button{font-size:1.05rem;padding:10px 10px 8px}
  .pick{font-size:.88rem;padding:9px 6px}
  .crest{width:26px;height:30px}
  .crest-img{width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="pitch">
  <header class="top wrap">
    <div class="brand">
      <div>
        <h1>Predicción LUD</h1>
        <p>Mayores, Divisional A 2026</p>
      </div>
      <div class="who" id="who" aria-live="polite">
        <span class="who-l" id="whoLabel">Jugás como</span><b id="whoName">…</b>
        <button class="authbtn" id="authBtn" type="button" hidden></button>
      </div>
    </div>
    <div class="kick" id="kick" aria-live="polite"></div>
  </header>
</div>
<nav class="tabs" role="tablist">
  <div class="wrap">
    <button role="tab" id="tab-pronosticar" aria-selected="true" data-tab="pronosticar">Pronosticar</button>
    <button role="tab" id="tab-tabla" aria-selected="false" data-tab="tabla">Tabla</button>
    <button role="tab" id="tab-resultados" aria-selected="false" data-tab="resultados">Resultados</button>
    <button role="tab" id="tab-panel" aria-selected="false" data-tab="panel" hidden>Panel</button>
  </div>
</nav>

<main class="wrap" id="main">
  <div class="empty" id="loading">Cargando la penca…</div>
</main>

<div class="toast" id="toast" hidden></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, deleteField, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const S = { partidos: [], jugadores: [], picks: [], user: null, authListo: false, tab: 'pronosticar', fecha: null, pendingClaim: null, listo: { p: false, j: false } };
const $main = document.getElementById('main');
const $whoName = document.getElementById('whoName');
const $whoLabel = document.getElementById('whoLabel');
const $authBtn = document.getElementById('authBtn');
const $toast = document.getElementById('toast');

const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
S.tab = store.get('plud-tab') || 'pronosticar';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const noon = d => new Date(d+'T12:00:00-03:00');
const fmtDia = d => { const x = noon(d); return `${DIAS[x.getUTCDay()]} ${x.getUTCDate()} ${MESES[x.getUTCMonth()]}`; };
const fmtHora = dt => dt.toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'America/Montevideo' });

function toast(msg){ $toast.textContent = msg; $toast.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $toast.hidden = true, 2400); }

if (!firebaseConfig || !firebaseConfig.apiKey) {
  $main.innerHTML = `<div class="notice warn"><strong>Falta configurar Firebase</strong>Pegá la configuración del proyecto en <code>firebase-config.js</code>.</div>`;
  throw new Error('firebase-config.js sin completar');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- reglas de juego ----------
const played = p => Number.isFinite(p.gl) && Number.isFinite(p.gv);
const outcome = p => !played(p) ? null : p.gl > p.gv ? 'L' : p.gl < p.gv ? 'V' : 'E';
const locked = p => played(p) || Date.now() >= p.cierre.getTime();
const fechas = () => [...new Set(S.partidos.map(p => p.fecha))].sort((a,b)=>a-b);
function defaultFecha(){
  const fs = fechas(); if (!fs.length) return null;
  return fs.find(f => S.partidos.some(p => p.fecha === f && !locked(p)))
      ?? fs.find(f => S.partidos.some(p => p.fecha === f && !played(p)))
      ?? fs[fs.length-1];
}
// Quién no completó los partidos abiertos de una fecha.
function faltanVotar(f){
  const abiertos = S.partidos.filter(p => p.fecha === f && !locked(p));
  const lista = abiertos.length ? S.jugadores.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(j => {
    const pk = picksPor(j.id); const n = abiertos.filter(p => !pk[p.id]).length;
    return n ? { j, n } : null;
  }).filter(Boolean) : [];
  return { abiertos, lista };
}
function faltanBox(f){
  if (!S.user) return '';
  const { abiertos, lista } = faltanVotar(f);
  if (!abiertos.length) return '';
  const rots = [-4,3,-2,5,-5,2,-3,4];
  const cards = lista.map((x,i) => `<span class="ycard" style="--rot:${rots[i % rots.length]}deg"><b>${esc(x.j.nombre)}</b>${x.n < abiertos.length ? `<small>le falta${x.n>1?'n':''} ${x.n}</small>` : ''}</span>`).join('');
  return `<section class="faltan"><h3>Faltan votar</h3>${lista.length ? `<div class="cards">${cards}</div>` : '<span class="todos">Ya votaron todos.</span>'}</section>`;
}
const diaMvd = dt => dt.toLocaleDateString('en-CA', { timeZone: 'America/Montevideo' });
// El día de la fecha: el que más se repite entre sus partidos (normalmente el domingo).
function diaDeFecha(f){ const c = {}; for (const p of S.partidos) if (p.fecha === f) c[p.dia] = (c[p.dia]||0)+1; return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0]?.[0]; }
function cierreFecha(f){ const ps = S.partidos.filter(p => p.fecha === f); return new Date(Math.max(...ps.map(p => p.cierre.getTime()))); }

// Escudo con iniciales: "Carrasco Lawn Tennis" -> CLT, "ELF" -> ELF, "Nacional U." -> NU.
function iniciales(n){
  const fijos = { 'Juan XXIII': 'J23' }; if (fijos[n]) return fijos[n];
  const w = n.replace(/\./g,'').split(/\s+/).filter(x => x && !/^(y|de|del|la)$/i.test(x));
  if (w.length === 1) return w[0].slice(0, w[0].length <= 4 && w[0] === w[0].toUpperCase() ? 4 : 3).toUpperCase();
  return w.slice(0,3).map(x => x[0]).join('').toUpperCase();
}
// Escudos reales en escudos/<slug>.png; los que falten usan el de iniciales.
const ESCUDOS = new Set(['tape','old-woodlands','tenis-el-pinar','urunday','old-boys','elf','carrasco-polo','nacional-u']);
const slugEq = n => n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function crest(n){
  const sl = slugEq(n);
  if (ESCUDOS.has(sl)) return `<img class="crest crest-img" src="escudos/${sl}.png" alt="" loading="lazy" width="40" height="40">`;
  const t = iniciales(n); const fs = t.length >= 4 ? 9 : t.length === 3 ? 11 : 13;
  return `<svg class="crest" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 1 L28 5 V16 C28 25 22 30 15 33 C8 30 2 25 2 16 V5 Z"/><text x="15" y="${t.length>=4?20:21}" text-anchor="middle" font-size="${fs}">${esc(t)}</text></svg>`;
}
// Cuenta regresiva al próximo cierre, en la franja de césped.
function renderKick(){
  const $k = document.getElementById('kick'); if (!$k) return;
  if (!S.listo.p || !S.partidos.length){ $k.innerHTML = ''; $k.className = 'kick'; return; }
  const ahora = Date.now();
  const abiertos = S.partidos.filter(p => !locked(p)).sort((a,b) => a.cierre - b.cierre);
  if (!abiertos.length){
    const pend = fechas().find(f => S.partidos.some(p => p.fecha === f && !played(p)));
    $k.className = 'kick';
    $k.innerHTML = pend
      ? `<div class="k-label">Fecha ${pend} cerrada</div><div class="k-big">A jugar</div><div class="k-sub">Los resultados se cargan solos los domingos de tarde.</div>`
      : `<div class="k-label">Temporada terminada</div><div class="k-big">Final</div>`;
    return;
  }
  const prox = abiertos[0]; const f = prox.fecha;
  let ms = prox.cierre.getTime() - ahora;
  const d = Math.floor(ms/864e5); ms -= d*864e5;
  const h = Math.floor(ms/36e5); ms -= h*36e5;
  const m = Math.max(0, Math.floor(ms/6e4));
  const big = d > 0 ? `${d}<small>d</small> ${h}<small>h</small>` : h > 0 ? `${h}<small>h</small> ${String(m).padStart(2,'0')}<small>m</small>` : `${m}<small>min</small>`;
  const me = yo(); const pk = me ? picksPor(me.id) : {};
  const mios = S.partidos.filter(p => p.fecha === f && !locked(p));
  const faltan = me ? mios.filter(p => !pk[p.id]).length : 0;
  const sub = !S.user ? 'Entrá con Google para pronosticar.'
    : !me ? 'Elegí tu nombre para pronosticar.'
    : faltan ? `Te ${faltan === 1 ? 'falta 1 partido' : `faltan ${faltan} partidos`} por votar.`
    : 'Ya votaste todo. Podés cambiar hasta el cierre.';
  $k.className = 'kick' + (d === 0 && h < 12 ? ' urgente' : '');
  $k.innerHTML = `<div class="k-label">La fecha ${f} cierra en</div><div class="k-big">${big}</div><div class="k-sub">${esc(fmtDia(diaMvd(prox.cierre)))} a las ${esc(fmtHora(prox.cierre))}. ${esc(sub)}</div>`;
}

function picksPor(jugadorId){ const o = {}; for (const k of S.picks) if (k.jugador === jugadorId) o[k.partido] = k.v; return o; }
function yo(){ return S.user ? S.jugadores.find(j => j.uid === S.user.uid) || null : null; }

const ADMIN_EMAIL = 'alanklein2006@gmail.com';
const esAdmin = () => !!S.user && S.user.email === ADMIN_EMAIL && S.user.emailVerified;

function score(j){
  const pk = picksPor(j.id); let pts = Number(j.base) || 0; const porFecha = {};
  for (const p of S.partidos){ const o = outcome(p), v = pk[p.id]; if (!o || !v) continue; const hit = v === o ? 1 : 0; pts += hit; porFecha[p.fecha] = (porFecha[p.fecha] || 0) + hit; }
  return { pts, base: Number(j.base) || 0, porFecha };
}

async function guardarCierre(partidoId, valor){
  const p = S.partidos.find(x => x.id === partidoId); if (!p || !valor) return;
  const elegido = new Date(`${valor}:00-03:00`);
  if (isNaN(elegido)) { toast('Fecha u hora inválida'); return; }
  try { await updateDoc(doc(db, 'partidos', partidoId), { cierreManual: elegido }); toast(`${p.local} vs ${p.visitante}: cierra el ${fmtDia(diaMvd(elegido))} a las ${fmtHora(elegido)}`); }
  catch(e){ toast('No se pudo guardar. Revisá que las reglas de Firebase estén actualizadas.'); }
}

async function cierreAutomatico(partidoId){
  const p = S.partidos.find(x => x.id === partidoId); if (!p) return;
  try { await updateDoc(doc(db, 'partidos', partidoId), { cierreManual: deleteField() }); toast(`${p.local} vs ${p.visitante}: vuelve al cierre automático`); }

async function liberar(jugadorId){
  const j = S.jugadores.find(x => x.id === jugadorId); if (!j || !j.uid) return;
  const b = writeBatch(db);
  b.update(doc(db, 'jugadores', jugadorId), { uid: null, cuentaNombre: null });
  b.delete(doc(db, 'cuentas', j.uid));
  for (const k of S.picks.filter(k => k.uid === j.uid || k.id.startsWith(j.uid + '_'))) b.delete(doc(db, 'picks', k.id));
  try { await b.commit(); S.panelConfirm = null; toast(`${j.nombre} quedó libre`); }
  catch(e){ toast('No se pudo liberar. Revisá que las reglas de Firebase estén actualizadas.'); }
}

async function agregarJugador(nombre, base){

function matchCard(p, me){
  const pk = me ? picksPor(me.id)[p.id] || null : null;
  const o = outcome(p), lk = locked(p);
  const canEdit = !!me && !lk;
  const state = played(p) ? 'Final' : lk ? 'Cerrado' : 'Abierto';
  const stCls = played(p) ? 'final' : lk ? '' : 'open';
  const cls = v => { let c = 'pick' + (v==='E'?' e':''); if (o && pk === v) c += pk === o ? ' hit' : ' miss'; if (o && o === v && pk !== v) c += ' result'; if (S.pop === p.id+v) c += ' pop'; return c; };
  const team = (v, name, sc) => `<button class="${cls(v)}" data-pick="${v}" data-id="${esc(p.id)}" aria-pressed="${pk===v}" ${canEdit?'':'disabled'} aria-label="Gana ${esc(name)}">${crest(name)}<span class="tn">${esc(name)}</span>${sc!=null?`<span class="sc">${sc}</span>`:''}</button>`;
  const emp = `<button class="${cls('E')}" data-pick="E" data-id="${esc(p.id)}" aria-pressed="${pk==='E'}" ${canEdit?'':'disabled'} aria-label="Empate">X</button>`;
  const quienes = S.jugadores.map(j => [j, picksPor(j.id)[p.id]]).filter(([,v]) => v);
  let vote = '';
  if (quienes.length){
    const n = { L:0, E:0, V:0 }; for (const [,v] of quienes) n[v]++;
    const tot = quienes.length;
    const bar = ['L','E','V'].filter(k => n[k]).map(k => `<span class="v${k.toLowerCase()}" style="flex:${n[k]}"></span>`).join('');
    const nombres = `<div class="others">${quienes.map(([j,v]) => `<span><b>${esc(j.nombre)}</b> ${esc(v==='L'?p.local:v==='V'?p.visitante:'Empate')}</span>`).join('')}</div>`;
    vote = `<div class="vote"><div class="vbar" role="img" aria-label="${n.L} con ${esc(p.local)}, ${n.E} empate, ${n.V} con ${esc(p.visitante)}">${bar}</div>
      <div class="vleg"><span><b>${n.L}</b> ${esc(p.local)}</span><span><b>${n.E}</b> empate</span><span><b>${n.V}</b> ${esc(p.visitante)}</span></div>${lk ? nombres : ''}</div>`;
    void tot;
  }
  const hora = p.horaAConfirmar ? 'hora a confirmar' : `${p.hora} h`;
  return `<article class="match">
    <div class="meta"><span>${esc(fmtDia(p.dia))}, ${esc(hora)}. ${esc(p.cancha)}</span><span class="state ${stCls}">${state}</span></div>
    <div class="picks">${team('L', p.local, o?p.gl:null)}${emp}${team('V', p.visitante, o?p.gv:null)}</div>
    ${vote}
  </article>`;
}

function renderTabla(){

  const rows = S.jugadores.map(j => ({ j, ...score(j) })).sort((a,b) => b.pts-a.pts || a.j.nombre.localeCompare(b.j.nombre,'es'));
  if (!rows.length){ $main.innerHTML = `<div class="empty">Todavía no hay jugadores en la penca.</div>`; return; }
  const hayBase = rows.some(r => r.base);
  const me = yo();
  let pos = 0, prev = null;
  const body = rows.map((r,i) => { if (r.pts !== prev){ pos = i+1; prev = r.pts; }
    const sub = r.j.uid ? (r.j.cuentaNombre ? `<span class="acct">${esc(r.j.cuentaNombre)}</span>` : '') : `<span class="acct">sin reclamar</span>`;
    const cl = [me && r.j.id===me.id ? 'me' : '', pos <= 3 ? `p${pos}` : ''].join(' ').trim();
    return `<tr class="${cl}"><td class="pos"><span class="posn">${pos}</span></td><td class="name">${esc(r.j.nombre)}${sub}</td><td class="pts">${r.pts}</td>${hayBase?`<td class="f">${r.base}</td>`:''}${fs.map(f=>`<td class="f">+${r.porFecha[f] ?? 0}</td>`).join('')}</tr>`; }).join('');
  $main.innerHTML = identityBox() + `<p class="lede">1 punto por acertar ganador o empate. Se suma solo cuando la Liga carga el resultado.${hayBase?' «Antes» son los puntos que traían del grupo hasta la fecha 4.':''} Debajo de cada nombre está la cuenta de Google que lo usa.</p>
    <div class="tablewrap"><table><thead><tr><th>#</th><th class="name">Jugador</th><th>Pts</th>${hayBase?'<th>Antes</th>':''}${fs.map(f=>`<th>F${f}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderResultados(){
  const fs = fechas().filter(f => S.partidos.some(p => p.fecha === f && played(p))).reverse();
  if (!fs.length){ $main.innerHTML = `<div class="empty">Todavía no hay resultados cargados.</div>`; return; }
  let html = '';
  for (const f of fs){
    const ps = S.partidos.filter(p => p.fecha === f).sort((a,b)=> b.zona.localeCompare(a.zona) || (a.dia+a.hora).localeCompare(b.dia+b.hora));
    html += `<section class="zona"><h2>Fecha ${f}<small>${esc(fmtDia(diaDeFecha(f)))}</small></h2><div class="matches">` + ps.map(p => {
      const o = outcome(p);
      const chips = S.jugadores.map(j => [j, picksPor(j.id)[p.id]]).filter(([,v]) => v).map(([j,v]) => `<span class="chip ${o ? (v===o?'hit':'miss') : ''}">${esc(j.nombre)}</span>`).join('');
      return `<article class="match"><div class="meta"><span>Zona ${esc(p.zona)}. ${esc(p.cancha)}</span></div>
        <div class="res"><span class="t l">${esc(p.local)}${crest(p.local)}</span>${o?`<span class="score">${p.gl}-${p.gv}</span>`:`<span class="score pend">vs</span>`}<span class="t">${crest(p.visitante)}${esc(p.visitante)}</span></div>
        ${chips?`<div class="chips">${chips}</div>`:''}</article>`;
    }).join('') + `</div></section>`;
  }
  $main.innerHTML = html;
}

// ---------- acciones ----------
async function login(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(auth, provider); }
  catch(e){
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return signInWithRedirect(auth, provider);
    if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('No se pudo entrar. Probá de nuevo.');
  }
}

async function claim(jugadorId){
  const j = S.jugadores.find(x => x.id === jugadorId); if (!j || !S.user) return;
  const b = writeBatch(db);
  b.update(doc(db, 'jugadores', jugadorId), { uid: S.user.uid, cuentaNombre: (S.user.displayName || S.user.email || '').slice(0, 80) });
  b.set(doc(db, 'cuentas', S.user.uid), { jugador: jugadorId });
  try { await b.commit(); S.pendingClaim = null; toast(`Listo, sos ${j.nombre}`); }
  catch(e){ toast(`No se pudo: ${j.nombre} ya fue reclamado o tu cuenta ya tiene un nombre.`); S.pendingClaim = null; render(); }
}

let chain = Promise.resolve();
function savePick(partidoId, v){
  const me = yo(); if (!me) return;
  const p = S.partidos.find(x => x.id === partidoId);
  if (!p || locked(p)){ toast('Ese partido ya cerró'); render(); return; }
  const id = `${S.user.uid}_${partidoId}`;
  const cur = picksPor(me.id)[partidoId] || null;
  const next = cur === v ? null : v;
  // Cambio optimista; la confirmación llega por el snapshot.
  S.picks = S.picks.filter(k => k.id !== id);
  if (next) S.picks.push({ id, jugador: me.id, partido: partidoId, v: next });
  S.pop = next ? partidoId + next : null;
  render();
  S.pop = null;
  chain = chain.then(() => next
      ? setDoc(doc(db, 'picks', id), { uid: S.user.uid, jugador: me.id, partido: partidoId, v: next, t: serverTimestamp() })
      : deleteDoc(doc(db, 'picks', id)))
    .then(() => toast(next ? 'Pronóstico guardado' : 'Pronóstico borrado'))
    .catch(() => toast('No se pudo guardar: el partido ya cerró o se cortó la conexión.'));
}

// ---------- eventos ----------
document.querySelector('nav.tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  S.tab = b.dataset.tab; store.set('plud-tab', S.tab); render();
});
$authBtn.addEventListener('click', () => S.user ? signOut(auth) : login());
$main.addEventListener('click', e => {
  if (e.target.closest('button[data-login]')) { login(); return; }
  const f = e.target.closest('button[data-fecha]'); if (f){ S.fecha = Number(f.dataset.fecha); render(); return; }
  const p = e.target.closest('button[data-pick]'); if (p && !p.disabled){ savePick(p.dataset.id, p.dataset.pick); return; }
  const c = e.target.closest('button[data-claim]'); if (c){ S.pendingClaim = c.dataset.claim; render(); return; }
  const k = e.target.closest('button[data-confirm]'); if (k){ k.disabled = true; claim(k.dataset.confirm); return; }
  if (!esAdmin()) return;
  const pl = e.target.closest('button[data-pedir-liberar]'); if (pl){ S.panelConfirm = pl.dataset.pedirLiberar; render(); return; }
  if (e.target.closest('button[data-cancelar]')){ S.panelConfirm = null; render(); return; }
  const lb = e.target.closest('button[data-liberar]'); if (lb){ lb.disabled = true; liberar(lb.dataset.liberar); return; }
  const ca = e.target.closest('button[data-cierre-auto]'); if (ca){ ca.disabled = true; cierreAutomatico(ca.dataset.cierreAuto); return; }
  const pf = e.target.closest('button[data-panel-fecha]'); if (pf){ S.panelFecha = Number(pf.dataset.panelFecha); render(); }
});
$main.addEventListener('submit', e => {
  if (!esAdmin()) return;
  e.preventDefault();
  if (e.target.id === 'addForm'){ agregarJugador(document.getElementById('addName').value, document.getElementById('addBase').value); return; }
  if (e.target.dataset.cierreForm){ guardarCierre(e.target.dataset.cierreForm, e.target.querySelector('input').value); return; }
  const id = e.target.dataset.baseForm;
  if (id) guardarBase(id, e.target.querySelector('input').value);
});

// ---------- datos en vivo ----------
const fail = msg => () => { $main.innerHTML = `<div class="notice warn"><strong>No se pudo cargar la penca</strong>${msg}</div>`; };
onSnapshot(collection(db, 'partidos'), snap => {
  const aFecha = v => v == null ? null : v.toDate ? v.toDate() : new Date(v);
  S.partidos = snap.docs.map(d => { const x = d.data(); const auto = aFecha(x.cierre), manual = aFecha(x.cierreManual);
    return { id: d.id, ...x, cierreAuto: auto, cierreManual: manual, cierre: manual || auto }; });
  S.listo.p = true; render();
}, fail('Revisá tu conexión y recargá la página.'));
onSnapshot(collection(db, 'jugadores'), snap => {
  S.jugadores = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  S.listo.j = true; render();
}, fail('Revisá tu conexión y recargá la página.'));

let unsubPicks = null;
onAuthStateChanged(auth, u => {
  S.user = u; S.authListo = true;
  document.getElementById('tab-panel').hidden = !esAdmin();
  if (S.tab === 'panel' && !esAdmin()) S.tab = 'pronosticar';
  if (unsubPicks){ unsubPicks(); unsubPicks = null; }
  S.picks = [];
  if (u) unsubPicks = onSnapshot(collection(db, 'picks'), snap => { S.picks = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
  render();
});

setInterval(() => { renderKick(); if (S.tab === 'pronosticar' && !document.activeElement?.matches('input')) render(); }, 60000);
setInterval(renderKick, 15000);
render();
</script>
