name: Resultados de la Liga

on:
  schedule:
    # Horario en UTC. Uruguay es UTC-3: 17:05 UTC = domingo 14:05 en Montevideo.
    - cron: '5 17 * * 0'
    # Domingo 18:05 en Montevideo, por si la Liga carga tarde algún resultado.
    - cron: '5 21 * * 0'
    # Lunes a miércoles 20:05 en Montevideo, por partidos que se pasan a días de semana.
    - cron: '5 23 * * 1,2,3'
  # También corre cuando se cargan resultados a mano.
  push:
    paths:
      - 'data/resultados-manuales.json'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run actualizar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titulo="No se pudieron cargar los resultados de la Liga"
          if [ -z "$(gh issue list --state open --search "$titulo in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$titulo" --body "El robot de resultados no pudo leer la página de la Liga Universitaria o no pudo guardar en Firebase. Los resultados de la penca no se están actualizando.

          Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Este aviso se cierra solo cuando el robot vuelva a funcionar."
          fi
      - name: Cerrar el aviso si volvió a andar
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --state open --search "No se pudieron cargar los resultados de la Liga in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Volvió a funcionar el $(TZ=America/Montevideo date '+%d/%m %H:%M')."
          done
