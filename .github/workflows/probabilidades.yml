name: Probabilidades de Calculadora LUD

on:
  schedule:
    # UTC. Uruguay es UTC-3. Domingo 20:05 (la calculadora recalcula después de la fecha),
    # y lunes, miércoles y viernes 10:05 en Montevideo.
    - cron: '5 23 * * 0'
    - cron: '5 13 * * 1,3,5'
  push:
    paths:
      - 'scripts/probabilidades.mjs'
      - '.github/workflows/probabilidades.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probabilidades
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/probabilidades.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-penca"
          git config user.email "robot-penca@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada para guardar"; exit 0; fi
          git commit -m "Actualizar probabilidades de Calculadora LUD"
          git push
