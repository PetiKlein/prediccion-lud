name: Minutos y posibles bajas

on:
  push:
    branches: [explorar-lud]
    paths: ['scripts/detalle.mjs', 'scripts/categorias.mjs', '.github/workflows/bajas.yml']
  schedule:
    # Horario en UTC (Uruguay = UTC-3). Domingo 18:35 y lunes a miércoles 20:35 en Montevideo,
    # para agarrar las planillas que la Liga carga tarde. Solo corre desde la rama principal.
    - cron: '35 21 * * 0'
    - cron: '35 23 * * 1,2,3'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bajas
  cancel-in-progress: false

jobs:
  bajas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/detalle.mjs
      - run: node scripts/bajas.mjs
      - name: Guardar datos
        if: always()
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data
          git diff --cached --quiet || { git commit -m "Datos de partidos actualizados" && git push; }
