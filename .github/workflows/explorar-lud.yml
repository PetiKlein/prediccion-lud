name: Explorar API de la LUD (temporal)
on:
  push:
    branches: [explorar-lud]
    paths: ['.github/workflows/explorar-lud.yml']
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Bajar páginas y scripts
        run: |
          B=https://ligauniversitaria.org.uy
          mkdir -p explorar && cd explorar
          curl -sL "$B/resultados/F21AT.html" -o resultados.html
          curl -sL "$B/partidos/F21AT.html" -o partidos.html
          for f in resultados.html partidos.html; do
            d=${f%.html}
            grep -oE 'src="[^"]+\.js[^"]*"' "$f" | sed 's/src="//;s/"$//' | sort -u | while read s; do
              case "$s" in http*) u="$s";; /*) u="$B$s";; *) u="$B/$d/$s";; esac
              n="$d-$(basename "${s%%\?*}")"
              curl -sL "$u" -o "$n"; echo "$u -> $n" >> scripts.txt
            done
          done
          curl -sL "$B/resultados/detallePartido.html?id=102327" -o detalle.html
          grep -oE 'src="[^"]+\.js[^"]*"' detalle.html | sed 's/src="//;s/"$//' | sort -u | while read s; do
            case "$s" in http*) u="$s";; /*) u="$B$s";; *) u="$B/resultados/$s";; esac
            n="detalle-$(basename "${s%%\?*}")"; curl -sL "$u" -o "$n"; echo "$u -> $n" >> scripts.txt
          done
          for a in $(cat detalle-*.js 2>/dev/null | grep -oE 'action=[A-Za-z]+' | sort -u | cut -d= -f2); do
            curl -sL "$B/resultados/api.php?action=$a&id=102327" -o "api-$a.json"
          done
          ls -la
      - name: Guardar
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add explorar && git commit -m "Resultado de la exploración" && git push
